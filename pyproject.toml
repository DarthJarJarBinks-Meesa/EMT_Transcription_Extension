[tool.poetry]
package-mode = false

[project]
name = "emt-epcr-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "YourAverageCoder",email = "150834749+CoderForCash@users.noreply.github.com"}
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi>=0.135.3,<1.0.0",
    "uvicorn[standard]>=0.43.0,<1.0.0",
    "python-multipart>=0.0.22,<1.0.0",
    "groq>=1.1.2,<2.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "httpx>=0.28.1,<1.0.0",
    "slowapi>=0.1.9,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# Pylance / BasedPyright: resolve third-party imports from the Poetry venv in this folder.
[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.basedpyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
